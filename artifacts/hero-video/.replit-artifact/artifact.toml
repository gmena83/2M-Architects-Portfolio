kind = "video"
previewPath = "/hero-video/"
title = "Hero — Planos y Croquis"
version = "1.0.0"
id = "artifacts/hero-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/hero-video/" ]
localPort = 21402

[services.development]
run = "pnpm --filter @workspace/hero-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hero-video", "run", "build" ]
publicDir = "artifacts/hero-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21402"
BASE_PATH = "/hero-video/"
